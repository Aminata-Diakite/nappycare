<!--download section start-->
    <section class="download-section pt-100 background-img"
             style="background: url('img/app-hero-bg.jpg')no-repeat center center / cover">
        <div class="container">
            <div class="row align-items-center justify-content-between">
                <div class="col-md-7">
                    <div class="download-content text-white pb-100">
                        <h2 class="text-white">Réservez votre rendez-vous, <br>
                            repartez avec le style parfait</h2>
                        <p class="lead">Appelez-nous ou écrivez-nous pour choisir votre créneau. Nous vous répondons rapidement pour confirmer votre rendez-vous.</p>

                        <div class="download-btn">
                            <a [href]="telHref" class="btn google-play-btn me-3"><span class="ti-mobile"></span> Appeler</a>
                            <a [href]="waHref" target="_blank" rel="noopener" class="btn app-store-btn"><span class="ti-comment-alt"></span> WhatsApp</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="download-img d-flex align-items-end">
                        <img src="img/app-hand-top.png" alt="download" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!--download section end-->
