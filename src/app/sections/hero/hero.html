<!--hero section start-->
    <section class="hero-section pt-100 background-img"
             style="background: url('img/app-hero-bg.jpg')no-repeat center center / cover">
        <div class="container">
            <div class="row align-items-center justify-content-between py-5">
                <div class="col-md-7 col-lg-6 col-xl-5">
                    <div class="hero-content-left text-white">
                        <h1 class="text-white fw-bold">Une coiffure qui vous ressemble</h1>
                        <p class="lead">
                            Coupes, tresses, colorations et soins : prenez rendez-vous et repartez avec le style que vous aimez. Votre salon de confiance.
                        </p>

                        <form class="subscribe-form" (submit)="allerAuContact($event)">
                            <div class="d-flex align-items-center">
                                <input type="text" class="form-control input" id="email" name="email"
                                       placeholder="Votre email">
                                <input type="submit" class="button btn solid-btn" id="submit" value="Réserver">
                            </div>
                        </form>

                        <div class="video-promo-content py-4 d-flex align-items-center">
                            <a href="https://www.youtube.com/watch?v=9No-FiEInLA"
                               class="popup-youtube video-play-icon-without-bip video-play-icon me-3"><span class="ti-control-play"></span></a> Voir le salon en vidéo

                        </div>
                    </div>
                </div>
                <div class="col-md-5 col-lg-5">
                    <div class="hero-animation-img">
                        <img src="img/app-product.png" alt="app" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom-img-absolute">
            <img src="img/hero-bg-shape-1.svg" alt="wave shape" class="img-fluid">
        </div>
    </section>
    <!--hero section end-->
