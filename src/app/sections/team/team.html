<!--our team section start-->
    <section id="team" class="team-member-section ptb-100 gray-light-bg">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7 col-md-8">
                    <div class="section-heading text-center mb-5">
                        <h2>Notre équipe</h2>
                        <p class="lead">
                            Des professionnels passionnés, à votre écoute pour sublimer vos cheveux.
                        </p>
                    </div>
                </div>
            </div>
            <div class="row g-4">
                @for (membre of equipe; track membre.nom) {
                <div class="col-lg-3 col-sm-6">
                    <div class="single-team-member position-relative">
                        <div class="team-image">
                            <img [src]="membre.photo" [alt]="membre.nom" class="img-fluid rounded-circle">
                        </div>
                        <div class="team-info text-white rounded-circle d-flex flex-column align-items-center justify-content-center">
                            <h5 class="mb-0">{{ membre.nom }}</h5>
                            <h6>{{ membre.role }}</h6>
                            <ul class="list-inline team-social social-icon mt-4 text-white">
                                <li class="list-inline-item"><a href="#"><span class="ti-facebook"></span></a></li>
                                <li class="list-inline-item"><a href="#"><span class="ti-instagram"></span></a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                }

            </div>
        </div>
    </section>
    <!--our team section end-->
